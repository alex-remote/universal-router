name: "[claude] Generate PR Title & Description"

# 使用 Claude AI 自动生成 PR 标题与描述
#
# 本工作流会自动生成：
# - 基于仓库既有模式、符合 Conventional Commit 风格的 PR 标题
# - 基于近期已合并 PR 模板的详尽 PR 描述
#
# 特性：
# - 跳过 rebase（使用 patch-ID 检测实际的代码变更）
# - 从近期提交中学习标题模式
# - 从近期已合并的 PR 中学习描述模板
# - 强制使用 Conventional Commit 格式
# - 保留标记区段之外的用户内容

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# 并发控制：取消同一 PR 正在进行中的运行
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-pr-metadata:
    # 跳过条件：
    # - 合并队列（merge queue）PR（单独处理）
    # - Dependabot PR（已有规范的标题）
    # - 发布（release）PR（有其自身的格式）
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.head_ref, 'gh-readonly-queue/') &&
      !contains(github.head_ref, 'gtmq') &&
      !contains(github.head_ref, 'dependabot/') &&
      !contains(github.head_ref, 'release/') &&
      !startsWith(github.event.pull_request.title, 'chore(release):')

    uses: Uniswap/ai-toolkit/.github/workflows/_generate-pr-metadata.yml@96ef665ba04221de07e94fcc3ea69fe32c7cf306
    with:
      generation_mode: "description,deferred-title"
      pr_number: ${{ github.event.pull_request.number }}
      base_ref: ${{ github.base_ref }}
      commit_history_count: 30
      pr_history_count: 10
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
